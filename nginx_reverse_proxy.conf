proxy_cache_path /var/cache/nginx/log levels=1:2 keys_zone=log_cache:1m max_size=50m inactive=10s use_temp_path=off;

# Leaky bucket: sheds excess load at the edge, before a connection is opened to upstream.
limit_req_zone $binary_remote_addr zone=exchange_limit:10m rate=500r/s;
limit_req_status 429;

upstream api {
    server api:3000;

    # Keep a pool of persistent connections open to the upstream(s) instead of opening/closing a TCP connection per request
    keepalive 64;
}

server {
    listen 80;

    location = /log {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache log_cache;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location = /exchange {
        limit_req zone=exchange_limit burst=100 nodelay;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
